# Checks for every push and pull request.
#
# Deploys are NOT here: Cloudflare Workers Builds watches the repo and ships
# the Worker itself, so this workflow only has to decide whether the code is
# good. Keep it that way — two things deploying is one thing too many.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Two passes: the browser bundle and the Worker, which have different
      # globals (DOM vs. workerd) and so different tsconfigs.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The room reducer and the netcode client run headless under bun.
      - name: Test
        run: bun test

      - name: Build
        run: bun run build
