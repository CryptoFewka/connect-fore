<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="Fore! - NES-style 3D golf meets four in a row. Aim, pick your power, and thread the ball through a gap in the board." />
    <title>Fore! — Four in a Row Golf</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0f1a;
        color: #e8f0ff;
        font-family: ui-monospace, "Courier New", monospace;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        touch-action: none;
        /* viewport-fit=cover puts the page under the notch and the home
           indicator; keep the picture clear of both. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* In a WebView a long press otherwise raises the selection callout, and
         the game's own press-and-hold gesture is swallowed by it. */
      #app,
      #app canvas {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #fallback {
        max-width: 40ch;
        padding: 1.5rem;
        text-align: center;
        line-height: 1.6;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <noscript>
        <div id="fallback">Fore! needs JavaScript and WebGL to run.</div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
