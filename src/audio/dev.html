<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Fore! — APU bench</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8f0ff;
        --dim: #8cb4ff;
        --gold: #fcd830;
        --shell: #2a2f45;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px 48px;
        background: #0b0f1a;
        color: var(--ink);
        font-family: ui-monospace, "Courier New", monospace;
        line-height: 1.5;
      }
      main { max-width: 62ch; margin: 0 auto; }
      h1 { font-size: 1.25rem; color: var(--gold); margin: 0 0 0.25rem; letter-spacing: 0.08em; }
      p.lede { color: var(--dim); margin: 0 0 1.5rem; font-size: 0.8rem; }
      section {
        border: 2px solid var(--shell);
        border-radius: 6px;
        padding: 12px 14px 16px;
        margin-bottom: 18px;
        background: #12172a;
      }
      h2 {
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 0 0 10px;
      }
      .grid { display: flex; flex-wrap: wrap; gap: 8px; }
      button {
        font: inherit;
        font-size: 0.75rem;
        color: var(--ink);
        background: #1d2440;
        border: 2px solid #3a4470;
        border-bottom-width: 4px;
        border-radius: 4px;
        padding: 7px 11px;
        cursor: pointer;
      }
      button:hover { background: #263056; }
      button:active { border-bottom-width: 2px; transform: translateY(2px); }
      button[data-role="primary"] { color: #10141f; background: var(--gold); border-color: #a8892a; }
      button[aria-pressed="true"] { color: #10141f; background: #7de08a; border-color: #3f8a4c; }
      label { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; }
      input[type="range"] { flex: 1; accent-color: var(--gold); }
      #status {
        font-size: 0.72rem;
        color: var(--dim);
        min-height: 1.4em;
        margin-top: 10px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CONNECT FORE! — APU BENCH</h1>
      <p class="lede">
        Every sound below is synthesised by the WebAudio 2A03 in
        <code>src/audio</code>. No samples ship with the game. Press START first —
        browsers only let an AudioContext run after a gesture.
      </p>

      <section>
        <h2>Transport</h2>
        <div class="grid">
          <button id="unlock" data-role="primary" type="button">▶ START AUDIO</button>
          <button id="mute" type="button" aria-pressed="false">MUTE</button>
        </div>
        <div id="status" role="status">Idle.</div>
      </section>

      <section>
        <h2>Music</h2>
        <div class="grid" id="tracks"></div>
      </section>

      <section>
        <h2>Sound effects</h2>
        <div class="grid" id="sfx"></div>
      </section>

      <section>
        <h2>Stress</h2>
        <div class="grid">
          <button id="sweep" type="button">METER SWEEP (20/s for 2s)</button>
          <button id="rally" type="button">SWING → THREAD → DROP → CLACK</button>
        </div>
      </section>

      <section>
        <h2>Mix</h2>
        <label>
          VOLUME
          <input id="volume" type="range" min="0" max="100" step="1" />
          <output id="volume-out">70</output>
        </label>
      </section>
    </main>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
